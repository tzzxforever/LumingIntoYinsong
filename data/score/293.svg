</style></defs><text class="h1" x="620.0" y="52.0" text-anchor="middle" font-size="30">酌</text><text class="h2" x="620.0" y="78.0" text-anchor="middle" font-size="15">周颂·闵予小子之什　四拍一小节　1=C</text><text class="rule" x="48.0" y="106.0" text-anchor="start" font-size="14">四声对五音：阴平→2商(D)　阳平→1宫(C)　入声→3角(E)　上声→5徵(G)　去声→6羽(A)</text><text class="rule" x="48.0" y="126.0" text-anchor="start" font-size="14">平长仄短，入短韵长：平声 1 拍　上声/去声 ½ 拍　入声 ¼ 拍　韵脚延长至 2 倍</text><text class="rule" x="48.0" y="146.0" text-anchor="start" font-size="13">读法：数字下方横线＝减时线；右侧圆点＝附点；右侧短横＝增时线（每条一拍）；弧线＝延音线；数字下方小圆点＝低八度</text><text class="src" x="48.0" y="168.0" text-anchor="start" font-size="19">1.　于铄王师，遵养时晦。时纯熙矣，是用大介。我龙受之，蹻蹻王之造。载用有嗣，实维尔公允师。</text><text class="meta" x="48.0" y="189.0" text-anchor="start" font-size="13">4/4　9 小节　句末落小节线　内部字最大改动 0.00 拍　末字伸缩 2.38×</text><text class="meter" x="56.0" y="254.0" text-anchor="end" font-size="17">4/4</text><text class="num" x="106.0" y="254.0" text-anchor="middle" font-size="33">1</text><text class="ch" x="106.0" y="308.0" text-anchor="middle" font-size="26">于</text><text class="tone" x="106.0" y="332.0" text-anchor="middle" font-size="14">2</text><text class="num ru" x="148.8" y="254.0" text-anchor="middle" font-size="33">3</text><line class="ul ru" x1="138.1" y1="266.0" x2="159.4" y2="266.0" stroke-width="1.8"/><line class="ul ru" x1="138.1" y1="272.5" x2="159.4" y2="272.5" stroke-width="1.8"/><text class="ch" x="148.8" y="308.0" text-anchor="middle" font-size="26">铄</text><text class="tone" x="148.8" y="332.0" text-anchor="middle" font-size="14">!</text><text class="num" x="191.5" y="254.0" text-anchor="middle" font-size="33">1</text><text class="ch" x="191.5" y="308.0" text-anchor="middle" font-size="26">王</text><text class="tone" x="191.5" y="332.0" text-anchor="middle" font-size="14">2</text><text class="num" x="239.8" y="254.0" text-anchor="middle" font-size="33">2</text><circle class="dot" cx="252.8" cy="244.0" r="2.7"/><text class="num" x="261.8" y="254.0" text-anchor