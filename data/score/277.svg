</style></defs><text class="h1" x="620.0" y="52.0" text-anchor="middle" font-size="30">噫嘻</text><text class="h2" x="620.0" y="78.0" text-anchor="middle" font-size="15">周颂·臣工之什　四拍一小节　1=C</text><text class="rule" x="48.0" y="106.0" text-anchor="start" font-size="14">四声对五音：阴平→2商(D)　阳平→1宫(C)　入声→3角(E)　上声→5徵(G)　去声→6羽(A)</text><text class="rule" x="48.0" y="126.0" text-anchor="start" font-size="14">平长仄短，入短韵长：平声 1 拍　上声/去声 ½ 拍　入声 ¼ 拍　韵脚延长至 2 倍</text><text class="rule" x="48.0" y="146.0" text-anchor="start" font-size="13">读法：数字下方横线＝减时线；右侧圆点＝附点；右侧短横＝增时线（每条一拍）；弧线＝延音线；数字下方小圆点＝低八度</text><text class="src" x="48.0" y="168.0" text-anchor="start" font-size="19">1.　噫嘻成王，既昭假尔。率时农夫，播厥百谷。骏发尔私，终三十里。亦服尔耕，十千维耦。</text><text class="meta" x="48.0" y="189.0" text-anchor="start" font-size="13">4/4　9 小节　句末落小节线　内部字最大改动 0.00 拍　末字伸缩 2.88×</text><text class="meter" x="56.0" y="254.0" text-anchor="end" font-size="17">4/4</text><text class="num" x="106.0" y="254.0" text-anchor="middle" font-size="33">2</text><text class="ch" x="106.0" y="308.0" text-anchor="middle" font-size="26">噫</text><text class="tone" x="106.0" y="332.0" text-anchor="middle" font-size="14">1</text><text class="num" x="157.0" y="254.0" text-anchor="middle" font-size="33">2</text><text class="ch" x="157.0" y="308.0" text-anchor="middle" font-size="26">嘻</text><text class="tone" x="157.0" y="332.0" text-anchor="middle" font-size="14">1</text><text class="num" x="208.0" y="254.0" text-anchor="middle" font-size="33">1</text><text class="ch" x="208.0" y="308.0" text-anchor="middle" font-size="26">成</text><text class="tone" x="208.0" y="332.0" text-anchor="middle" font-size="14">2</text><text class="num" x="259.0" y="254.0" text-anchor="middle" font-size="33">1</text><text class="ch" x="259.0" y="308.0" text-anchor="middle" font-size="26">王</text><text class="tone" x="259.0" y="332.0" text-anchor="middle" font-size="14">2</text><line class="bar" x1="288.0" y1="226.0" x2="288.0" y2="336.0" stroke-width="1.5"/><text class="num" x="316.5" y