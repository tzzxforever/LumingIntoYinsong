</style></defs><text class="h1" x="620.0" y="52.0" text-anchor="middle" font-size="30">狡童</text><text class="h2" x="620.0" y="78.0" text-anchor="middle" font-size="15">国风·郑风　四拍一小节　1=C</text><text class="rule" x="48.0" y="106.0" text-anchor="start" font-size="14">四声对五音：阴平→2商(D)　阳平→1宫(C)　入声→3角(E)　上声→5徵(G)　去声→6羽(A)</text><text class="rule" x="48.0" y="126.0" text-anchor="start" font-size="14">平长仄短，入短韵长：平声 1 拍　上声/去声 ½ 拍　入声 ¼ 拍　韵脚延长至 2 倍</text><text class="rule" x="48.0" y="146.0" text-anchor="start" font-size="13">读法：数字下方横线＝减时线；右侧圆点＝附点；右侧短横＝增时线（每条一拍）；弧线＝延音线；数字下方小圆点＝低八度</text><text class="src" x="48.0" y="168.0" text-anchor="start" font-size="19">1.　彼狡童兮，不与我言兮。维子之故，使我不能餐兮。</text><text class="meta" x="48.0" y="189.0" text-anchor="start" font-size="13">4/4　5 小节　句末落小节线　内部字最大改动 0.00 拍　末字伸缩 2.38×</text><text class="meter" x="56.0" y="254.0" text-anchor="end" font-size="17">4/4</text><text class="num" x="100.5" y="254.0" text-anchor="middle" font-size="33">5</text><line class="ul" x1="87.5" y1="266.0" x2="113.5" y2="266.0" stroke-width="1.8"/><text class="ch" x="100.5" y="308.0" text-anchor="middle" font-size="26">彼</text><text class="tone" x="100.5" y="332.0" text-anchor="middle" font-size="14">3</text><text class="num" x="140.5" y="254.0" text-anchor="middle" font-size="33">5</text><line class="ul" x1="127.5" y1="266.0" x2="153.5" y2="266.0" stroke-width="1.8"/><text class="ch" x="140.5" y="308.0" text-anchor="middle" font-size="26">狡</text><text class="tone" x="140.5" y="332.0" text-anchor="middle" font-size="14">3</text><text class="num" x="186.0" y="254.0" text-anchor="middle" font-size="33">1</text><text class="ch" x="186.0" y="308.0" text-anchor="middle" font-size="26">童</text><text class="tone" x="186.0" y="332.0" text-anchor="middle" font-size="14">2</text><text class="num" x="240.0" y="254.0" text-anchor="middle" font-size="33">2</text><line class="dash" x1="251.0" y1="243.0" x2="267.0" y2="243.0" stroke-width="2"/><text class="ch" x="248.0" y="308.0" text-anchor="mi